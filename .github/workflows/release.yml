name: Publish preview
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    if: github.repository == 'tianma-if/edgeever-hotspot-tracker'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Verify version
        run: bun -e 'const m = await Bun.file("manifest.json").json(); const p = await Bun.file("package.json").json(); if (process.env.GITHUB_REF_NAME !== "v" + m.version || m.version !== p.version) throw new Error("Version mismatch");'
      - name: Create checksums
        working-directory: dist
        run: sha256sum manifest.json main.js LICENSE THIRD_PARTY_NOTICES.txt > SHA256SUMS.txt
      - name: Publish preview assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --title "EdgeEver 热点追踪 $RELEASE_TAG" --notes-file docs/release-notes.md
